/
├── .github/workflows/
│   └── build-apk.yml               <-- Flujo automatizado para compilar el APK en GitHub
├── android/
│   ├── build.gradle                <-- Configuración Gradle raíz del proyecto Android
│   ├── settings.gradle             <-- Inclusión del módulo :app (FenixTV)
│   ├── gradlew                     <-- Script ejecutable de Gradle para Linux / GitHub
│   ├── README_ANDROID.md           <-- Guía técnica de compilación y firma del APK
│   └── app/
│       ├── build.gradle            <-- Configuración SDK 34, Leanback y Media3
│       └── src/main/
│           ├── AndroidManifest.xml <-- Lanzador LEANBACK_LAUNCHER para Android TV
│           ├── java/com/fenixtv/app/MainActivity.java
│           └── res/drawable/banner.png (Logo original 3D)
├── public/
│   └── fenixtv_original_logo.png   <-- Tu logo oficial original en alta resolución
├── src/
│   ├── components/
│   │   ├── FenixLogo.tsx           <-- Componente con el logo original 3D oficial
│   │   ├── SplashScreen.tsx        <-- Pantalla de inicio con auto-transición
│   │   ├── TvSidebar.tsx           <-- Menú lateral para televisor
│   │   ├── HeroFeatured.tsx        <-- Banner cinemático principal
│   │   ├── ContentRow.tsx          <-- Carruseles horizontales con foco TV
│   │   ├── ContentDetailsModal.tsx <-- Pantalla de detalles previa a la reproducción
│   │   ├── VideoPlayer.tsx         <-- Reproductor con audio dual y reconexión
│   │   ├── LiveTvView.tsx          <-- Guía de canales en vivo EPG
│   │   ├── SportsView.tsx          <-- Sección de deportes y marcadores
│   │   ├── SearchView.tsx          <-- Buscador con teclado virtual para mando
│   │   ├── SettingsView.tsx        <-- Diagnóstico de red, buffer y caché
│   │   ├── PlansView.tsx           <-- Planes de suscripción ($15 / $20)
│   │   ├── SupportModal.tsx        <-- Soporte oficial WhatsApp
│   │   └── RemoteSimulator.tsx     <-- Mando de TV virtual para pruebas
│   ├── services/
│   │   └── providerService.ts      <-- Capa desacoplada para conectar proveedor Xtream/M3U
│   └── App.tsx                     <-- Orquestador principal de la plataforma
