name: Compilar FenixTV APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repo
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Compilar FenixTV Cinema Edition
        run: |
          mkdir -p app/src/main/java/com/fenixtv/app
          mkdir -p app/src/main/res/drawable

          IMG=$(find . -maxdepth 1 -type f \( -iname "*.png" -o -iname "*.jpg" -o -iname "*.jpeg" \) | head -n 1)
          if [ -n "$IMG" ]; then
            EXT="${IMG##*.}"
            EXT=$(echo "$EXT" | tr '[:upper:]' '[:lower:]')
            if [ "$EXT" = "jpeg" ]; then EXT="jpg"; fi
            cp "$IMG" "app/src/main/res/drawable/fenix_logo.$EXT"
          fi

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FenixTV"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace = "com.fenixtv.app"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.fenixtv.app"
                  minSdk 26
                  targetSdk 34
                  versionCode 4
                  versionName '2.0'
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="FenixTV" android:icon="@drawable/fenix_logo" android:banner="@drawable/fenix_logo" android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen">
                  <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="landscape" android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/fenixtv/app/MainActivity.java
          package com.fenixtv.app;

          import android.app.Activity;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.*;

          public class MainActivity extends Activity {
              private FrameLayout rootLayout;
              private LinearLayout cinemaDashboard;
              private TextView heroTitle, heroTags, heroSynopsis, heroRating;
              private VideoView videoPlayer;
              private ProgressBar loadingSpinner;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  rootLayout = new FrameLayout(this);
                  rootLayout.setBackgroundColor(Color.parseColor("#060608"));

                  cinemaDashboard = new LinearLayout(this);
                  cinemaDashboard.setOrientation(LinearLayout.VERTICAL);

                  // 1. Barra Superior con Logo Fénix y Reloj/Estado
                  LinearLayout topBar = new LinearLayout(this);
                  topBar.setOrientation(LinearLayout.HORIZONTAL);
                  topBar.setGravity(Gravity.CENTER_VERTICAL);
                  topBar.setPadding(40, 20, 40, 10);

                  ImageView logo = new ImageView(this);
                  int id = getResources().getIdentifier("fenix_logo", "drawable", getPackageName());
                  if (id != 0) logo.setImageResource(id);
                  logo.setLayoutParams(new LinearLayout.LayoutParams(160, 65));
                  topBar.addView(logo);

                  TextView liveBadge = new TextView(this);
                  liveBadge.setText("  ● ULTRA STREAMING 4K  ");
                  liveBadge.setTextColor(Color.parseColor("#00FF88"));
                  liveBadge.setTextSize(12);
                  liveBadge.setTypeface(Typeface.DEFAULT_BOLD);
                  topBar.addView(liveBadge);

                  cinemaDashboard.addView(topBar);

                  // 2. HERO BANNER CINEMATOGRÁFICO GIGANTE
                  LinearLayout heroBanner = new LinearLayout(this);
                  heroBanner.setOrientation(LinearLayout.VERTICAL);
                  heroBanner.setPadding(50, 15, 50, 20);

                  GradientDrawable heroBg = new GradientDrawable(
                      GradientDrawable.Orientation.LEFT_RIGHT,
                      new int[]{Color.parseColor("#220709"), Color.parseColor("#0F0F14")}
                  );
                  heroBg.setCornerRadius(16);
                  heroBanner.setBackground(heroBg);

                  heroTitle = new TextView(this);
                  heroTitle.setText("FENIX ORIGINS: EL RENACER DEL CINE");
                  heroTitle.setTextSize(26);
                  heroTitle.setTypeface(Typeface.DEFAULT_BOLD);
                  heroTitle.setTextColor(Color.WHITE);
                  heroTitle.setShadowLayer(25, 0, 0, Color.parseColor("#FF1A26"));
                  heroBanner.addView(heroTitle);

                  LinearLayout badgesRow = new LinearLayout(this);
                  badgesRow.setOrientation(LinearLayout.HORIZONTAL);
                  badgesRow.setPadding(0, 8, 0, 8);

                  heroRating = new TextView(this);
                  heroRating.setText("★★★★★ 9.8  |  ");
                  heroRating.setTextColor(Color.parseColor("#FFAA00"));
                  heroRating.setTextSize(13);
                  badgesRow.addView(heroRating);

                  heroTags = new TextView(this);
                  heroTags.setText("ESTRENO 2024  •  4K ULTRA HD  •  DOLBY ATMOS  •  AUDIO LATINO");
                  heroTags.setTextColor(Color.parseColor("#FF3344"));
                  heroTags.setTextSize(13);
                  heroTags.setTypeface(Typeface.DEFAULT_BOLD);
                  badgesRow.addView(heroTags);
                  heroBanner.addView(badgesRow);

                  heroSynopsis = new TextView(this);
                  heroSynopsis.setText("Selecciona cualquier película, canal o serie con tu control remoto para reproducir inmediatamente.");
                  heroSynopsis.setTextColor(Color.parseColor("#C0C0CC"));
                  heroSynopsis.setTextSize(14);
                  heroSynopsis.setMaxLines(2);
                  heroBanner.addView(heroSynopsis);

                  cinemaDashboard.addView(heroBanner);

                  // 3. SECCIONES HORIZONTALES (ESTILO NETFLIX CAROUSEL)
                  ScrollView mainScroll = new ScrollView(this);
                  mainScroll.setLayoutParams(new LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.MATCH_PARENT));

                  LinearLayout carouselsArea = new LinearLayout(this);
                  carouselsArea.setOrientation(LinearLayout.VERTICAL);
                  carouselsArea.setPadding(40, 20, 40, 40);

                  // FILA 1: PELÍCULAS DE ESTRENO
                  carouselsArea.addView(crearTituloFila("🔥 ESTRENOS Y PELÍCULAS DE CINE TOP 10"));
                  HorizontalScrollView moviesScroll = new HorizontalScrollView(this);
                  LinearLayout moviesRow = new LinearLayout(this);
                  moviesRow.setOrientation(LinearLayout.HORIZONTAL);

                  moviesRow.addView(crearPosterCine("Fénix Origins 4K", "Acción / Sci-Fi", "★★★★★ 9.8", "La misión secreta para salvar el futuro de la humanidad.", "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4", "#8A0B13"));
                  moviesRow.addView(crearPosterCine("Bosque Salvaje", "Animación Familiar", "★★★★☆ 9.2", "Una aventura épica a través de criaturas fantásticas.", "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4", "#1E3A5F"));
                  moviesRow.addView(crearPosterCine("Cacería Nocturna", "Suspenso / Thriller", "★★★★★ 9.6", "Persecución sin tregua en el corazón de la metrópoli.", "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4", "#2D1B4E"));
                  moviesRow.addView(crearPosterCine("Dragón de Hierro", "Artes Marciales", "★★★★☆ 8.9", "Honor, venganza y la mayor batalla de artes marciales.", "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4", "#592E0B"));

                  moviesScroll.addView(moviesRow);
                  carouselsArea.addView(moviesScroll);

                  // FILA 2: CANALES DE TV EN VIVO
                  carouselsArea.addView(crearTituloFila("📺 TELEVISIÓN EN DIRECTO [🔴 EN VIVO 24/7]"));
                  HorizontalScrollView liveScroll = new HorizontalScrollView(this);
                  LinearLayout liveRow = new LinearLayout(this);
                  liveRow.setOrientation(LinearLayout.HORIZONTAL);

                  liveRow.addView(crearPosterCanal("FÉNIX DEPORTES HD", "Fútbol Internacional & Champions en Directo", "EN VIVO", "Transmisión oficial del canal deportivo estelar.", "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4"));
                  liveRow.addView(crearPosterCanal("NOTICIAS MUNDIAL HLS", "Transmisión de Noticias Satelital Continua", "SEÑAL VIVO", "Conexión de noticias globales en tiempo real.", "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"));
                  liveRow.addView(crearPosterCanal("CINE CABLE GOLD", "Películas de Hollywood 24 Horas sin Pausa", "ESTELAR", "La señal premium de películas clásicas y taquilleras.", "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"));

                  liveScroll.addView(liveRow);
                  carouselsArea.addView(liveScroll);

                  // FILA 3: PLANES DE ACCESO VIP
                  carouselsArea.addView(crearTituloFila("💎 MEMBRESÍAS FENIXTV VIP"));
                  HorizontalScrollView plansScroll = new HorizontalScrollView(this);
                  LinearLayout plansRow = new LinearLayout(this);
                  plansRow.setOrientation(LinearLayout.HORIZONTAL);

                  plansRow.addView(crearTarjetaMembresia("PLAN BÁSICO DIGITAL", "$15 / Mes", "• 1 Dispositivo en simultáneo\n• Calidad Full HD 1080p\n• Cine y Canales en Vivo"));
                  plansRow.addView(crearTarjetaMembresia("PLAN PREMIUM ULTRA 4K", "$20 / Mes", "• Hasta 3 Dispositivos a la vez\n• Calidad Ultra HD 4K + HDR\n• Catálogo Completo VIP\n• Soporte Prioritario 24/7"));

                  plansScroll.addView(plansRow);
                  carouselsArea.addView(plansScroll);

                  mainScroll.addView(carouselsArea);
                  cinemaDashboard.addView(mainScroll);
                  rootLayout.addView(cinemaDashboard);

                  // 4. REPRODUCTOR DE CINE
                  videoPlayer = new VideoView(this);
                  videoPlayer.setLayoutParams(new FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT));
                  videoPlayer.setVisibility(View.GONE);
                  rootLayout.addView(videoPlayer);

                  loadingSpinner = new ProgressBar(this);
                  FrameLayout.LayoutParams lpSp = new FrameLayout.LayoutParams(130, 130);
                  lpSp.gravity = Gravity.CENTER;
                  loadingSpinner.setLayoutParams(lpSp);
                  loadingSpinner.setVisibility(View.GONE);
                  rootLayout.addView(loadingSpinner);

                  setContentView(rootLayout);
              }

              private TextView crearTituloFila(String texto) {
                  TextView t = new TextView(this);
                  t.setText(texto);
                  t.setTextSize(16);
                  t.setTypeface(Typeface.DEFAULT_BOLD);
                  t.setTextColor(Color.parseColor("#FF2A36"));
                  t.setShadowLayer(14, 0, 0, Color.parseColor("#FF0011"));
                  t.setPadding(0, 20, 0, 10);
                  return t;
              }

              private View crearPosterCine(String titulo, String genero, String estrellas, String sinopsis, String url, String colorHex) {
                  LinearLayout card = new LinearLayout(this);
                  card.setOrientation(LinearLayout.VERTICAL);
                  card.setPadding(20, 20, 20, 20);
                  card.setGravity(Gravity.BOTTOM);
                  card.setFocusable(true);
                  card.setFocusableInTouchMode(true);

                  GradientDrawable normalBg = new GradientDrawable(
                      GradientDrawable.Orientation.TOP_BOTTOM,
                      new int[]{Color.parseColor(colorHex), Color.parseColor("#0B0B10")}
                  );
                  normalBg.setCornerRadius(14);
                  normalBg.setStroke(2, Color.parseColor("#252530"));

                  GradientDrawable focusBg = new GradientDrawable(
                      GradientDrawable.Orientation.TOP_BOTTOM,
                      new int[]{Color.parseColor("#B00B16"), Color.parseColor("#150305")}
                  );
                  focusBg.setCornerRadius(14);
                  focusBg.setStroke(4, Color.parseColor("#FF1A26"));

                  card.setBackground(normalBg);

                  TextView tag = new TextView(this);
                  tag.setText("★ 4K HDR");
                  tag.setTextColor(Color.parseColor("#FFAA00"));
                  tag.setTextSize(10);
                  tag.setTypeface(Typeface.DEFAULT_BOLD);
                  card.addView(tag);

                  TextView t = new TextView(this);
                  t.setText(titulo);
                  t.setTextSize(16);
                  t.setTypeface(Typeface.DEFAULT_BOLD);
                  t.setTextColor(Color.WHITE);
                  card.addView(t);

                  TextView g = new TextView(this);
                  g.setText(genero);
                  g.setTextSize(11);
                  g.setTextColor(Color.parseColor("#A0A0B0"));
                  card.addView(g);

                  card.setOnFocusChangeListener((v, hasFocus) -> {
                      card.setBackground(hasFocus ? focusBg : normalBg);
                      card.animate().scaleX(hasFocus ? 1.10f : 1.0f).scaleY(hasFocus ? 1.10f : 1.0f).setDuration(160).start();
                      if (hasFocus) {
                          heroTitle.setText(titulo.toUpperCase());
                          heroRating.setText(estrellas + "  |  ");
                          heroTags.setText(genero.toUpperCase() + "  •  4K ULTRA HD  •  FENIX CINEMA");
                          heroSynopsis.setText(sinopsis);
                      }
                  });

                  card.setOnClickListener(v -> reproducir(url));

                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(220, 290);
                  lp.setMargins(10, 8, 20, 15);
                  card.setLayoutParams(lp);
                  return card;
              }

              private View crearPosterCanal(String nombre, String detalle, String badge, String sinopsis, String url) {
                  LinearLayout card = new LinearLayout(this);
                  card.setOrientation(LinearLayout.VERTICAL);
                  card.setPadding(22, 18, 22, 18);
                  card.setGravity(Gravity.CENTER_VERTICAL);
                  card.setFocusable(true);
                  card.setFocusableInTouchMode(true);

                  GradientDrawable normalBg = new GradientDrawable();
                  normalBg.setColor(Color.parseColor("#12121A"));
                  normalBg.setCornerRadius(12);
                  normalBg.setStroke(2, Color.parseColor("#222230"));

                  GradientDrawable focusBg = new GradientDrawable();
                  focusBg.setColor(Color.parseColor("#80070E"));
                  focusBg.setCornerRadius(12);
                  focusBg.setStroke(4, Color.parseColor("#FF2233"));

                  card.setBackground(normalBg);

                  TextView live = new TextView(this);
                  live.setText("● " + badge);
                  live.setTextColor(Color.parseColor("#FF2A36"));
                  live.setTextSize(11);
                  live.setTypeface(Typeface.DEFAULT_BOLD);
                  card.addView(live);

                  TextView t = new TextView(this);
                  t.setText(nombre);
                  t.setTextSize(16);
                  t.setTypeface(Typeface.DEFAULT_BOLD);
                  t.setTextColor(Color.WHITE);
                  card.addView(t);

                  TextView d = new TextView(this);
                  d.setText(detalle);
                  d.setTextSize(11);
                  d.setTextColor(Color.parseColor("#9090A0"));
                  card.addView(d);

                  card.setOnFocusChangeListener((v, hasFocus) -> {
                      card.setBackground(hasFocus ? focusBg : normalBg);
                      card.animate().scaleX(hasFocus ? 1.08f : 1.0f).scaleY(hasFocus ? 1.08f : 1.0f).setDuration(160).start();
                      if (hasFocus) {
                          heroTitle.setText(nombre.toUpperCase());
                          heroRating.setText("★★★★★ 9.9 EN VIVO  |  ");
                          heroTags.setText("TRANSMISIÓN DIGITAL EN DIRECTO  •  60 FPS  •  LATENCIA CERO");
                          heroSynopsis.setText(sinopsis);
                      }
                  });

                  card.setOnClickListener(v -> reproducir(url));

                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(340, 150);
                  lp.setMargins(10, 8, 20, 15);
                  card.setLayoutParams(lp);
                  return card;
              }

              private View crearTarjetaMembresia(String nombre, String precio, String benef) {
                  LinearLayout card = new LinearLayout(this);
                  card.setOrientation(LinearLayout.VERTICAL);
                  card.setPadding(26, 20, 26, 20);
                  card.setFocusable(true);
                  card.setFocusableInTouchMode(true);

                  GradientDrawable bg = new GradientDrawable();
                  bg.setColor(Color.parseColor("#151218"));
                  bg.setCornerRadius(14);
                  bg.setStroke(2, Color.parseColor("#441820"));

                  GradientDrawable bgFocus = new GradientDrawable();
                  bgFocus.setColor(Color.parseColor("#660A10"));
                  bgFocus.setCornerRadius(14);
                  bgFocus.setStroke(3, Color.parseColor("#FFAA00"));

                  card.setBackground(bg);

                  TextView t = new TextView(this);
                  t.setText(nombre);
                  t.setTextColor(Color.parseColor("#FFAA00"));
                  t.setTextSize(14);
                  t.setTypeface(Typeface.DEFAULT_BOLD);
                  card.addView(t);

                  TextView p = new TextView(this);
                  p.setText(precio);
                  p.setTextColor(Color.WHITE);
                  p.setTextSize(24);
                  p.setTypeface(Typeface.DEFAULT_BOLD);
                  card.addView(p);

                  TextView b = new TextView(this);
                  b.setText(benef);
                  b.setTextColor(Color.parseColor("#D0D0E0"));
                  b.setTextSize(12);
                  b.setPadding(0, 8, 0, 0);
                  card.addView(b);

                  card.setOnFocusChangeListener((v, hasFocus) -> {
                      card.setBackground(hasFocus ? bgFocus : bg);
                      card.animate().scaleX(hasFocus ? 1.06f : 1.0f).scaleY(hasFocus ? 1.06f : 1.0f).setDuration(160).start();
                  });

                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(380, 210);
                  lp.setMargins(10, 8, 20, 15);
                  card.setLayoutParams(lp);
                  return card;
              }

              private void reproducir(String url) {
                  cinemaDashboard.setVisibility(View.GONE);
                  videoPlayer.setVisibility(View.VISIBLE);
                  loadingSpinner.setVisibility(View.VISIBLE);

                  videoPlayer.setVideoURI(Uri.parse(url));
                  videoPlayer.setOnPreparedListener(mp -> {
                      loadingSpinner.setVisibility(View.GONE);
                      videoPlayer.start();
                  });
                  videoPlayer.setOnCompletionListener(mp -> cerrarVideo());
                  videoPlayer.setOnErrorListener((mp, what, extra) -> {
                      loadingSpinner.setVisibility(View.GONE);
                      Toast.makeText(MainActivity.this, "Error conectando con la señal.", Toast.LENGTH_SHORT).show();
                      cerrarVideo();
                      return true;
                  });
              }

              private void cerrarVideo() {
                  if (videoPlayer.isPlaying()) videoPlayer.stopPlayback();
                  videoPlayer.setVisibility(View.GONE);
                  loadingSpinner.setVisibility(View.GONE);
                  cinemaDashboard.setVisibility(View.VISIBLE);
              }

              @Override
              public void onBackPressed() {
                  if (videoPlayer.getVisibility() == View.VISIBLE) {
                      cerrarVideo();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          gradle assembleDebug

      - name: Subir instalador APK Cinema Edition
        uses: actions/upload-artifact@v4
        with:
          name: FenixTV-CinemaEdition
          path: app/build/outputs/apk/debug/*.apk
