name: Compilar FenixTV APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repo
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Compilar FenixTV Netflix Edition
        run: |
          mkdir -p app/src/main/java/com/fenixtv/app
          mkdir -p app/src/main/res/drawable

          IMG=$(find . -maxdepth 1 -type f \( -iname "*.png" -o -iname "*.jpg" -o -iname "*.jpeg" \) | head -n 1)
          if [ -n "$IMG" ]; then
            EXT="${IMG##*.}"
            EXT=$(echo "$EXT" | tr '[:upper:]' '[:lower:]')
            if [ "$EXT" = "jpeg" ]; then EXT="jpg"; fi
            cp "$IMG" "app/src/main/res/drawable/fenix_logo.$EXT"
          fi

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FenixTV"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace = "com.fenixtv.app"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.fenixtv.app"
                  minSdk 26
                  targetSdk 34
                  versionCode 5
                  versionName '3.0'
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="FenixTV" android:icon="@drawable/fenix_logo" android:banner="@drawable/fenix_logo" android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen">
                  <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="landscape" android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/fenixtv/app/MainActivity.java
          package com.fenixtv.app;

          import android.animation.ObjectAnimator;
          import android.animation.PropertyValuesHolder;
          import android.animation.ValueAnimator;
          import android.app.Activity;
          import android.content.Context;
          import android.graphics.*;
          import android.graphics.drawable.GradientDrawable;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.*;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.Random;

          public class MainActivity extends Activity {
              private FrameLayout rootLayout;
              private FrameLayout introContainer;
              private LinearLayout netflixLayout;
              private TextView heroTitle, heroMeta, heroSynopsis;
              private Button heroPlayBtn;
              private String currentHeroUrl = "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4";
              private VideoView videoPlayer;
              private ProgressBar loadingSpinner;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  rootLayout = new FrameLayout(this);
                  rootLayout.setBackgroundColor(Color.parseColor("#141414"));

                  configurarIntroFuegoYVuelo();
                  configurarNetflixUI();

                  setContentView(rootLayout);

                  // Transición cinematográfica de la intro a la interfaz Netflix
                  new Handler(Looper.getMainLooper()).postDelayed(() -> {
                      introContainer.animate().alpha(0f).setDuration(800).withEndAction(() -> {
                          introContainer.setVisibility(View.GONE);
                          netflixLayout.setVisibility(View.VISIBLE);
                          netflixLayout.setAlpha(0f);
                          netflixLayout.animate().alpha(1f).setDuration(600).start();
                          heroPlayBtn.requestFocus();
                      }).start();
                  }, 4200);
              }

              // --- 1. INTRO: HUMO, FUEGO Y AVE FÉNIX VOLANDO ---
              private void configurarIntroFuegoYVuelo() {
                  introContainer = new FrameLayout(this);
                  introContainer.setBackgroundColor(Color.parseColor("#070709"));
                  introContainer.setLayoutParams(new FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT));

                  // Motor de partículas de fuego y humo
                  FireAndSmokeCanvas fireCanvas = new FireAndSmokeCanvas(this);
                  introContainer.addView(fireCanvas);

                  // Contenedor del Fénix para animación de vuelo
                  LinearLayout flightBox = new LinearLayout(this);
                  flightBox.setOrientation(LinearLayout.VERTICAL);
                  flightBox.setGravity(Gravity.CENTER);
                  FrameLayout.LayoutParams flightParams = new FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.WRAP_CONTENT, FrameLayout.LayoutParams.WRAP_CONTENT);
                  flightParams.gravity = Gravity.CENTER;
                  flightBox.setLayoutParams(flightParams);

                  ImageView fenixBird = new ImageView(this);
                  int id = getResources().getIdentifier("fenix_logo", "drawable", getPackageName());
                  if (id != 0) fenixBird.setImageResource(id);
                  fenixBird.setLayoutParams(new LinearLayout.LayoutParams(520, 290));
                  flightBox.addView(fenixBird);

                  TextView introTitle = new TextView(this);
                  introTitle.setText("FENIXTV");
                  introTitle.setTextColor(Color.parseColor("#FF1E27"));
                  introTitle.setTextSize(36);
                  introTitle.setTypeface(Typeface.DEFAULT_BOLD);
                  introTitle.setShadowLayer(35, 0, 0, Color.parseColor("#FFAA00"));
                  introTitle.setGravity(Gravity.CENTER);
                  flightBox.addView(introTitle);

                  // Animación de vuelo: Remonta desde abajo, aleteo (escala) y estabilización
                  flightBox.setTranslationY(450f);
                  flightBox.setScaleX(0.4f);
                  flightBox.setScaleY(0.4f);

                  flightBox.animate()
                      .translationY(0f)
                      .scaleX(1.15f)
                      .scaleY(1.15f)
                      .setDuration(2600)
                      .withEndAction(() -> {
                          flightBox.animate().scaleX(1.0f).scaleY(1.0f).setDuration(500).start();
                      })
                      .start();

                  // Efecto constante de aleteo / batir de alas
                  ObjectAnimator flap = ObjectAnimator.ofPropertyValuesHolder(
                      fenixBird,
                      PropertyValuesHolder.ofFloat("scaleY", 1.0f, 0.88f, 1.05f, 1.0f),
                      PropertyValuesHolder.ofFloat("rotation", -2f, 2f, -2f)
                  );
                  flap.setDuration(450);
                  flap.setRepeatCount(ValueAnimator.INFINITE);
                  flap.start();

                  introContainer.addView(flightBox);
                  rootLayout.addView(introContainer);
              }

              // --- 2. INTERFAZ ESTILO NETFLIX ---
              private void configurarNetflixUI() {
                  netflixLayout = new LinearLayout(this);
                  netflixLayout.setOrientation(LinearLayout.VERTICAL);
                  netflixLayout.setVisibility(View.GONE);

                  // Barra de navegación superior Netflix
                  LinearLayout navBar = new LinearLayout(this);
                  navBar.setOrientation(LinearLayout.HORIZONTAL);
                  navBar.setGravity(Gravity.CENTER_VERTICAL);
                  navBar.setPadding(45, 18, 45, 12);
                  navBar.setBackgroundColor(Color.parseColor("#0F0F12"));

                  ImageView navLogo = new ImageView(this);
                  int id = getResources().getIdentifier("fenix_logo", "drawable", getPackageName());
                  if (id != 0) navLogo.setImageResource(id);
                  navLogo.setLayoutParams(new LinearLayout.LayoutParams(140, 50));
                  navBar.addView(navLogo);

                  navBar.addView(crearPestanaNav("Inicio", true));
                  navBar.addView(crearPestanaNav("Películas", false));
                  navBar.addView(crearPestanaNav("Series", false));
                  navBar.addView(crearPestanaNav("En Vivo", false));

                  netflixLayout.addView(navBar);

                  // Scroll Principal de Contenido
                  ScrollView netflixScroll = new ScrollView(this);
                  netflixScroll.setLayoutParams(new LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.MATCH_PARENT));

                  LinearLayout scrollContent = new LinearLayout(this);
                  scrollContent.setOrientation(LinearLayout.VERTICAL);

                  // BILLBOARD GIGANTE (HERO)
                  LinearLayout billboard = new LinearLayout(this);
                  billboard.setOrientation(LinearLayout.VERTICAL);
                  billboard.setPadding(55, 30, 55, 30);

                  GradientDrawable bbBg = new GradientDrawable(
                      GradientDrawable.Orientation.TOP_BOTTOM,
                      new int[]{Color.parseColor("#26080B"), Color.parseColor("#141414")}
                  );
                  billboard.setBackground(bbBg);

                  heroTitle = new TextView(this);
                  heroTitle.setText("FENIX: EL DESPERTAR DEL FUEGO");
                  heroTitle.setTextSize(32);
                  heroTitle.setTypeface(Typeface.DEFAULT_BOLD);
                  heroTitle.setTextColor(Color.WHITE);
                  heroTitle.setShadowLayer(25, 0, 0, Color.parseColor("#E50914"));
                  billboard.addView(heroTitle);

                  heroMeta = new TextView(this);
                  heroMeta.setText("98% para ti  •  2024  •  16+  •  2h 18m  •  Ultra HD 4K  •  5.1");
                  heroMeta.setTextColor(Color.parseColor("#46D369")); // Verde Netflix Match
                  heroMeta.setTextSize(14);
                  heroMeta.setTypeface(Typeface.DEFAULT_BOLD);
                  heroMeta.setPadding(0, 10, 0, 10);
                  billboard.addView(heroMeta);

                  heroSynopsis = new TextView(this);
                  heroSynopsis.setText("Una fuerza ancestral despierta para proteger la última llama de la humanidad. Una superproducción de acción y ciencia ficción exclusiva de FenixTV.");
                  heroSynopsis.setTextColor(Color.parseColor("#CCCCCC"));
                  heroSynopsis.setTextSize(14);
                  heroSynopsis.setMaxLines(3);
                  billboard.addView(heroSynopsis);

                  // Botones de acción del Billboard
                  LinearLayout btnRow = new LinearLayout(this);
                  btnRow.setOrientation(LinearLayout.HORIZONTAL);
                  btnRow.setPadding(0, 20, 0, 10);

                  heroPlayBtn = new Button(this);
                  heroPlayBtn.setText("▶  Reproducir");
                  heroPlayBtn.setTextSize(15);
                  heroPlayBtn.setTypeface(Typeface.DEFAULT_BOLD);
                  heroPlayBtn.setTextColor(Color.BLACK);
                  heroPlayBtn.setBackground(crearBotonDrawable(Color.WHITE, Color.parseColor("#E50914")));
                  heroPlayBtn.setPadding(35, 14, 35, 14);
                  heroPlayBtn.setFocusable(true);
                  heroPlayBtn.setOnClickListener(v -> reproducir(currentHeroUrl));
                  btnRow.addView(heroPlayBtn);

                  Button infoBtn = new Button(this);
                  infoBtn.setText("ℹ  Más información");
                  infoBtn.setTextSize(15);
                  infoBtn.setTextColor(Color.WHITE);
                  infoBtn.setBackground(crearBotonDrawable(Color.parseColor("#333333"), Color.parseColor("#555555")));
                  infoBtn.setPadding(30, 14, 30, 14);
                  infoBtn.setFocusable(true);
                  LinearLayout.LayoutParams ip = new LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                  ip.setMargins(20, 0, 0, 0);
                  infoBtn.setLayoutParams(ip);
                  btnRow.addView(infoBtn);

                  billboard.addView(btnRow);
                  scrollContent.addView(billboard);

                  // CARRUSELES NETFLIX
                  scrollContent.addView(crearFilaNetflix("🔥 Tendencias ahora", new String[]{
                      "Fénix: El Renacer 4K", "Misión Interestelar", "Cazadores de Medianoche", "El Último Dragón"
                  }, new String[]{
                      "98% para ti  •  4K Ultra HD", "95% para ti  •  Película", "99% para ti  •  Acción", "93% para ti  •  Fantasía"
                  }, "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4"));

                  scrollContent.addView(crearFilaNetflix("🎬 Películas de Estreno", new String[]{
                      "Bosque Infinito", "Código Sombra", "El Gran Escape", "Venganza de Titanes"
                  }, new String[]{
                      "Animación 4K", "Suspenso / Thriller", "Aventura Épica", "Acción Pura"
                  }, "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"));

                  scrollContent.addView(crearFilaNetflix("🍿 Series y Temporadas Completas", new String[]{
                      "Fénix Chronicles (T1: E1)", "Fénix Chronicles (T1: E2)", "Imperio Carmesí (T2)", "Cibernéticos"
                  }, new String[]{
                      "Episodio 1 • 52 min", "Episodio 2 • 58 min", "Temporada 2 Completa", "Nueva Temporada"
                  }, "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4"));

                  scrollContent.addView(crearFilaNetflix("📺 Canales en Directo [🔴 EN VIVO 24/7]", new String[]{
                      "FÉNIX DEPORTES HD", "NOTICIAS DEL MUNDO HLS", "CINE HOLLYWOOD 24/7", "FÉNIX MÚSICA & SHOWS"
                  }, new String[]{
                      "Fútbol y Deportes en Vivo", "Transmisión Satelital Continua", "Películas sin Pausas", "Conciertos en Exclusiva"
                  }, "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"));

                  netflixScroll.addView(scrollContent);
                  netflixLayout.addView(netflixScroll);
                  rootLayout.addView(netflixLayout);

                  // Reproductor de video
                  videoPlayer = new VideoView(this);
                  videoPlayer.setLayoutParams(new FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT));
                  videoPlayer.setVisibility(View.GONE);
                  rootLayout.addView(videoPlayer);

                  loadingSpinner = new ProgressBar(this);
                  FrameLayout.LayoutParams sp = new FrameLayout.LayoutParams(130, 130);
                  sp.gravity = Gravity.CENTER;
                  loadingSpinner.setLayoutParams(sp);
                  loadingSpinner.setVisibility(View.GONE);
                  rootLayout.addView(loadingSpinner);
              }

              private TextView crearPestanaNav(String titulo, boolean activa) {
                  TextView tv = new TextView(this);
                  tv.setText(titulo);
                  tv.setTextSize(14);
                  tv.setTypeface(Typeface.DEFAULT_BOLD);
                  tv.setTextColor(activa ? Color.WHITE : Color.parseColor("#999999"));
                  tv.setPadding(35, 8, 35, 8);
                  tv.setFocusable(true);
                  tv.setOnFocusChangeListener((v, hasFocus) -> {
                      tv.setTextColor(hasFocus ? Color.parseColor("#E50914") : (activa ? Color.WHITE : Color.parseColor("#999999")));
                  });
                  return tv;
              }

              private LinearLayout crearFilaNetflix(String categoria, String[] titulos, String[] descripciones, String streamUrl) {
                  LinearLayout section = new LinearLayout(this);
                  section.setOrientation(LinearLayout.VERTICAL);
                  section.setPadding(50, 15, 0, 15);

                  TextView catTitle = new TextView(this);
                  catTitle.setText(categoria);
                  catTitle.setTextSize(18);
                  catTitle.setTypeface(Typeface.DEFAULT_BOLD);
                  catTitle.setTextColor(Color.WHITE);
                  catTitle.setPadding(0, 0, 0, 12);
                  section.addView(catTitle);

                  HorizontalScrollView rowScroll = new HorizontalScrollView(this);
                  LinearLayout row = new LinearLayout(this);
                  row.setOrientation(LinearLayout.HORIZONTAL);

                  for (int i = 0; i < titulos.length; i++) {
                      String t = titulos[i];
                      String d = descripciones[i];
                      row.addView(crearTarjetaNetflix(t, d, streamUrl));
                  }

                  rowScroll.addView(row);
                  section.addView(rowScroll);
                  return section;
              }

              private View crearTarjetaNetflix(String titulo, String meta, String streamUrl) {
                  LinearLayout card = new LinearLayout(this);
                  card.setOrientation(LinearLayout.VERTICAL);
                  card.setGravity(Gravity.BOTTOM);
                  card.setPadding(22, 18, 22, 18);
                  card.setFocusable(true);
                  card.setFocusableInTouchMode(true);

                  GradientDrawable normal = new GradientDrawable(
                      GradientDrawable.Orientation.TOP_BOTTOM,
                      new int[]{Color.parseColor("#22222E"), Color.parseColor("#0C0C10")}
                  );
                  normal.setCornerRadius(10);
                  normal.setStroke(1, Color.parseColor("#33333F"));

                  GradientDrawable focused = new GradientDrawable(
                      GradientDrawable.Orientation.TOP_BOTTOM,
                      new int[]{Color.parseColor("#B80812"), Color.parseColor("#180406")}
                  );
                  focused.setCornerRadius(10);
                  focused.setStroke(4, Color.parseColor("#E50914"));

                  card.setBackground(normal);

                  TextView badge = new TextView(this);
                  badge.setText("TOP 10 FENIX");
                  badge.setTextColor(Color.parseColor("#FFAA00"));
                  badge.setTextSize(10);
                  badge.setTypeface(Typeface.DEFAULT_BOLD);
                  card.addView(badge);

                  TextView t = new TextView(this);
                  t.setText(titulo);
                  t.setTextColor(Color.WHITE);
                  t.setTextSize(15);
                  t.setTypeface(Typeface.DEFAULT_BOLD);
                  card.addView(t);

                  TextView m = new TextView(this);
                  m.setText(meta);
                  m.setTextColor(Color.parseColor("#AAAAAA"));
                  m.setTextSize(11);
                  card.addView(m);

                  card.setOnFocusChangeListener((v, hasFocus) -> {
                      card.setBackground(hasFocus ? focused : normal);
                      card.animate().scaleX(hasFocus ? 1.12f : 1.0f).scaleY(hasFocus ? 1.12f : 1.0f).setDuration(160).start();
                      if (hasFocus) {
                          heroTitle.setText(titulo.toUpperCase());
                          heroMeta.setText(meta + "  •  DISPONIBLE EN FENIXTV");
                          currentHeroUrl = streamUrl;
                      }
                  });

                  card.setOnClickListener(v -> reproducir(streamUrl));

                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(260, 150);
                  lp.setMargins(10, 8, 22, 15);
                  card.setLayoutParams(lp);
                  return card;
              }

              private GradientDrawable crearBotonDrawable(int normalColor, int focusColor) {
                  GradientDrawable gd = new GradientDrawable();
                  gd.setColor(normalColor);
                  gd.setCornerRadius(8);
                  return gd;
              }

              private void reproducir(String url) {
                  netflixLayout.setVisibility(View.GONE);
                  videoPlayer.setVisibility(View.VISIBLE);
                  loadingSpinner.setVisibility(View.VISIBLE);

                  videoPlayer.setVideoURI(Uri.parse(url));
                  videoPlayer.setOnPreparedListener(mp -> {
                      loadingSpinner.setVisibility(View.GONE);
                      videoPlayer.start();
                  });
                  videoPlayer.setOnCompletionListener(mp -> cerrarVideo());
                  videoPlayer.setOnErrorListener((mp, what, extra) -> {
                      loadingSpinner.setVisibility(View.GONE);
                      Toast.makeText(MainActivity.this, "Error conectando con la señal.", Toast.LENGTH_SHORT).show();
                      cerrarVideo();
                      return true;
                  });
              }

              private void cerrarVideo() {
                  if (videoPlayer.isPlaying()) videoPlayer.stopPlayback();
                  videoPlayer.setVisibility(View.GONE);
                  loadingSpinner.setVisibility(View.GONE);
                  netflixLayout.setVisibility(View.VISIBLE);
              }

              @Override
              public void onBackPressed() {
                  if (videoPlayer.getVisibility() == View.VISIBLE) {
                      cerrarVideo();
                  } else {
                      super.onBackPressed();
                  }
              }

              // --- 3. MOTOR NATIVO DE HUMO Y FUEGO ---
              private static class FireAndSmokeCanvas extends View {
                  private final Paint paint = new Paint();
                  private final List<Particle> particles = new ArrayList<>();
                  private final Random random = new Random();

                  public FireAndSmokeCanvas(Context context) {
                      super(context);
                      for (int i = 0; i < 90; i++) {
                          particles.add(new Particle(random));
                      }
                  }

                  @Override
                  protected void onDraw(Canvas canvas) {
                      super.onDraw(canvas);
                      int w = getWidth();
                      int h = getHeight();
                      if (w == 0 || h == 0) return;

                      for (Particle p : particles) {
                          p.update(w, h, random);
                          paint.setColor(p.color);
                          paint.setAlpha(p.alpha);
                          canvas.drawCircle(p.x, p.y, p.radius, paint);
                      }
                      postInvalidateOnAnimation();
                  }

                  private static class Particle {
                      float x, y, vy, vx, radius;
                      int alpha, color;
                      boolean isSmoke;

                      Particle(Random r) {
                          reset(1920, 1080, r, true);
                      }

                      void reset(int w, int h, Random r, boolean initial) {
                          x = (w / 2f) + (r.nextFloat() * 700 - 350);
                          y = initial ? r.nextFloat() * h : h + r.nextFloat() * 80;
                          isSmoke = r.nextBoolean();
                          radius = isSmoke ? (r.nextFloat() * 40 + 20) : (r.nextFloat() * 12 + 4);
                          vy = isSmoke ? -(r.nextFloat() * 3 + 1.5f) : -(r.nextFloat() * 9 + 4f);
                          vx = (r.nextFloat() * 2 - 1f);
                          alpha = isSmoke ? (r.nextInt(60) + 20) : (r.nextInt(180) + 70);
                          color = isSmoke ? Color.parseColor("#26262B") : 
                                  (r.nextBoolean() ? Color.parseColor("#FF2200") : Color.parseColor("#FFAA00"));
                      }

                      void update(int w, int h, Random r) {
                          x += vx;
                          y += vy;
                          alpha = Math.max(0, alpha - (isSmoke ? 1 : 3));
                          if (y < 0 || alpha <= 0) {
                              reset(w, h, r, false);
                          }
                      }
                  }
              }
          }
          EOF

          gradle assembleDebug

      - name: Subir instalador APK Netflix Edition
        uses: actions/upload-artifact@v4
        with:
          name: FenixTV-NetflixEdition
          path: app/build/outputs/apk/debug/*.apk
